<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: center;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        /* Align product names to the left */
        td:first-child, th:first-child {
            text-align: left;
        }
        .summary-label {
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Discount</th>
                <th>Final Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop</td>
                <td>₹50,000</td>
                <td>1</td>
                <td>₹50,000</td>
                <td>₹5,000</td>
                <td>₹45,000</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>₹1,000</td>
                <td>2</td>
                <td>₹2,000</td>
                <td>₹200</td>
                <td>₹1,800</td>
            </tr>
            <tr>
                <td>Keyboard</td>
                <td>₹2,000</td>
                <td>1</td>
                <td>₹2,000</td>
                <td>₹100</td>
                <td>₹1,900</td>
            </tr>
            <tr>
                <td>Headphones</td>
                <td>₹3,000</td>
                <td>1</td>
                <td>₹3,000</td>
                <td>₹300</td>
                <td>₹2,700</td>
            </tr>
        </tbody>
        <tfoot>
            <!-- Summary rows using colspan as required -->
            <tr>
                <td colspan="5" class="summary-label">Subtotal</td>
                <td>₹57,000</td>
            </tr>
            <tr>
                <td colspan="5" class="summary-label">Discount</td>
                <td>₹5,600</td>
            </tr>
            <tr>
                <td colspan="5" class="summary-label">Shipping</td>
                <td>₹200</td>
            </tr>
            <tr>
                <td colspan="5" class="summary-label">Grand Total</td>
                <td><strong>₹51,600</strong></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>

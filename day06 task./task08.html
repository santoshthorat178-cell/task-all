<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Bill</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: center;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
        /* Align item names to the left */
        td:first-child, th:first-child {
            text-align: left;
        }
        .summary-label {
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Restaurant Order Bill</h2>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>GST</th>
                <th>Discount</th>
                <th>Grand Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Paneer Tikka</td>
                <td>2</td>
                <td>₹360</td>
                <td>₹18</td>
                <td>₹20</td>
                <td>₹358</td>
            </tr>
            <tr>
                <td>Butter Chicken</td>
                <td>1</td>
                <td>₹280</td>
                <td>₹14</td>
                <td>₹15</td>
                <td>₹279</td>
            </tr>
            <tr>
                <td>Cold Coffee</td>
                <td>2</td>
                <td>₹200</td>
                <td>₹10</td>
                <td>₹10</td>
                <td>₹200</td>
            </tr>
        </tbody>
        <tfoot>
            <!-- Summary row using colspan as required -->
            <tr>
                <td colspan="5" class="summary-label">Grand Total Payable</td>
                <td><strong>₹837</strong></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>

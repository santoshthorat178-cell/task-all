<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git/GitHub Workflow</title>
</head>
<body>

    <h2>Git and GitHub Workflow</h2>
    <ol>
        <li>Local Repository Setup
            <ul>
                <li>git init</li>
                <li>git status</li>
            </ul>
        </li>
        <li>Staging and Committing Changes
            <ul>
                <li>git add .</li>
                <li>git commit -m "first commit"</li>
            </ul>
        </li>
        <li>Remote Synchronization
            <ul>
                <li>git remote add origin &lt;repository-url&gt;</li>
                <li>git branch -M main</li>
                <li>git push -u origin main</li>
            </ul>
        </li>
    </ol>

</body>
</html>

    <h2>Pasta Recipe</h2>

    <h3>Ingredients</h3>
    <ul>
        <li>Pasta</li>
        <li>Olive oil</li>
        <li>Garlic</li>
        <li>Tomato sauce</li>
        <li>Cheese</li>
    </ul>

    <h3>Preparation Steps</h3>
    <ol>
        <li>Boil water in a pot.</li>
        <li>Add pasta and cook until tender.</li>
        <li>Heat olive oil and sauté garlic.</li>
        <li>Add tomato sauce and mix well.</li>
        <li>Combine pasta with the sauce and serve hot.</li>
    </ol>
